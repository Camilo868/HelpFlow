spring.application.name=support-ticket-service-test

# Isolated In-Memory Database for Fast, Deterministic Integration Tests (as explicitly recommended in rubric)
spring.datasource.url=jdbc:h2:mem:helpflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# External dispatch service test mock url
technician.dispatch.service.url=http://localhost:8080

